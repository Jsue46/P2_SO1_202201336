apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: us-central1-docker.pkg.dev/sopes-202201336/bf-repo/gateway:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          env:
            - name: GRPC_SERVER_ADDR
              value: "event-writer.blackfriday:50051"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: blackfriday
spec:
  selector:
    app: gateway-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
