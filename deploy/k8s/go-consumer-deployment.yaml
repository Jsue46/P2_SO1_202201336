apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-consumer
  template:
    metadata:
      labels:
        app: go-consumer
    spec:
      containers:
        - name: go-consumer
          image: localhost:5001/go-consumer:latest
          env:
            - name: KAFKA_BROKER
              value: "my-cluster-kafka-bootstrap:9092"
            - name: VALKEY_ADDR
              value: "valkey-service:6379"
