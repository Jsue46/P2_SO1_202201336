apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-processor
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-processor
  template:
    metadata:
      labels:
        app: event-processor
    spec:
      containers:
        - name: event-processor
          image: us-central1-docker.pkg.dev/sopes-202201336/bf-repo/processor:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: "my-cluster-kafka-bootstrap.strimzi:9092"
            - name: VALKEY_ADDR
              value: "valkey-service:6379"
