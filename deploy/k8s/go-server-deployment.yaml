apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-writer
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-writer
  template:
    metadata:
      labels:
        app: event-writer
    spec:
      containers:
        - name: event-writer
          image: us-central1-docker.pkg.dev/sopes-202201336/bf-repo/writer:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: "my-cluster-kafka-bootstrap.strimzi:9092"
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: event-writer
  namespace: blackfriday
spec:
  selector:
    app: event-writer
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP
