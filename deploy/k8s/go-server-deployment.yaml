apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-grpc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-grpc-server
  template:
    metadata:
      labels:
        app: go-grpc-server
    spec:
      containers:
        - name: go-grpc-server
          image: localhost:5001/go-grpc-server:latest # Zot Registry
          env:
            - name: KAFKA_BROKER
              value: "my-cluster-kafka-bootstrap:9092" # Servicio K8s (Strimzi)
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: go-grpc-server-service
spec:
  selector:
    app: go-grpc-server
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP
