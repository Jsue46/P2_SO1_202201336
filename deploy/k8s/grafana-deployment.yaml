apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: blackfriday
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey-Local
        type: redis-datasource
        access: proxy
        url: redis://valkey-service:6379
        jsonData:
          client: standalone
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: blackfriday
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'BlackFriday'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: blackfriday
data:
  dashboard.json: |
    {{TU JSON COMPLETO TAL COMO LO MANDASTE}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: redis-datasource
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-dashboards-json
              mountPath: /var/lib/grafana/dashboards/dashboard.json
              subPath: dashboard.json
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: grafana-dashboards-json
          configMap:
            name: grafana-dashboards-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: blackfriday
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer
