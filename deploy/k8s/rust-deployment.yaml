apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: ingestion-api
          image: us-central1-docker.pkg.dev/sopes-202201336/bf-repo/ingestion:latest
          imagePullPolicy: Always

          # 🔥 CLAVE PARA HPA
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          env:
            - name: GO_API_URL
              value: "http://gateway-service.blackfriday.svc.cluster.local"

          ports:
            - containerPort: 5000

          # 🔥 RECOMENDADO PARA ESCALADO REAL
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: blackfriday
spec:
  selector:
    app: ingestion-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-api-hpa
  namespace: blackfriday
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
