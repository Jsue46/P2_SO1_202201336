version: '3.8'

services:
  # Servicio 1: Gateway REST (Go) -> gRPC Client
  gateway-service:
    build:
      context: ../../apps/gateway-service
    image: bf-gateway
    ports:
      - "8080:8080"
    environment:
      - GRPC_SERVER_ADDR=event-writer:50051
    depends_on:
      - event-writer

  # Servicio 2: gRPC Server + Kafka Producer
  event-writer:
    build:
      context: ../../apps/event-writer
    image: bf-writer
    ports:
      - "50051:50051"
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka

  # Servicio 3: Consumer + Valkey
  event-processor:
    build:
      context: ../../apps/event-processor
    image: bf-processor
    environment:
      - KAFKA_BROKER=kafka:29092
      - VALKEY_ADDR=valkey:6379
    depends_on:
      - kafka
      - valkey

  # Servicio 4: API de Ingesta (Rust)
  ingestion-api:
    build:
      context: ../../apps/ingestion-api
    image: bf-ingestion
    ports:
      - "5000:5000"
    environment:
      - GO_API_URL=http://gateway-service:8080
      - PORT=5000
    depends_on:
      - gateway-service
