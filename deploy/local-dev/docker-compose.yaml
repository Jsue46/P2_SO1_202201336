version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Exponer Kafka para acceso externo (Host) y interno (Docker networks)
      # Nota: Usamos puerto 9093 en host para evitar conflictos
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Valkey (o Redis como placeholder para pruebas locales)
  valkey:
    image: valkey/valkey:7.2
    ports:
      - "6379:6379"

  # Servicios simulados (para correr "go run main.go" localmente ellos se conectan a localhost:9092 / :6379)
  # Si quisiéramos correrlos en docker, usaríamos la red interna "kafka:29092"
